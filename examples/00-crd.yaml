# NodeReadinessRule CRD (simplified for demo purposes).
# In a real cluster this is installed by the node-readiness-controller itself.
# Apply this first if you want to try the plugin without deploying full NRC:
#   kubectl apply -f examples/00-crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodereadinessrules.readiness.node.x-k8s.io
spec:
  group: readiness.node.x-k8s.io
  scope: Cluster
  names:
    plural: nodereadinessrules
    singular: nodereadinessrule
    kind: NodeReadinessRule
    shortNames:
      - nrr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.enforcementMode
        - name: Taint
          type: string
          jsonPath: .spec.taint.key
